<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Time Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section class="planner">
            <h1>My Time Planner</h1>
            <p>Plan less. Do more.</p>

            <label for="startTime">Available From</label>
            <input id="startTime" type="time">

            <label for="sleepTime">Sleep At</label>
            <input id="sleepTime" type="time">

            <label for="taskInput">Task</label>
            <input
                id="taskInput"
                type="text"
                placeholder="e.g. Mathematics homework"
            >

            <label for="priorityInput">Priority</label>
            <select id="priorityInput">
                <option value="high">🔴 High</option>
                <option value="medium">🟡 Medium</option>
                <option value="low">🟢 Low</option>
            </select>
<label for="durationInput">Estimated Time</label>

	<input
    	id="durationInput"
    	type="number"
    	min="1"
    	placeholder="Minutes, e.g. 60"
	>
            <button id="addTaskBtn">Add Task</button>
        </section>

        <section class="tasks">
            <h2>Today's Tasks</h2>
            <ul id="taskList"></ul>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
